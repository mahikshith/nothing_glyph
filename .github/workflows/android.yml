name: Android CI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; add the platform and build tools this project compiles against.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Fetch Nothing Glyph SDK (not redistributed in this repo)
        run: ./scripts/fetch-glyph-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        # Unit tests run on the debug variant only: the Compose UI tests need the debug-only test manifest.
        run: ./gradlew :core-device:test :composition:test testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dotforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
